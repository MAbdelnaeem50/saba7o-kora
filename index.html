<style>

.mc:before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,#ffffff40,transparent)}

.sheet:before{content:"";display:block;width:46px;height:5px;border-radius:9px;background:#fff3;margin:0 auto 10px}
button.sec{border:1px solid #2f4d7c}
.top b{text-shadow:0 0 16px #ffc92877}

<body>
<div id="app"></div>
<script>
const $=document.getElementById('app');
const GOAL={top:100,pw:5,who:3};
const NAMES={top:'توب ١٠',pw:'باسورد',who:'مين أنا؟',grid:'الجدول'};
const S={t:['الفريق الأحمر','الفريق الأزرق'],w:[0,0],sc:[0,0],mode:null,used:{top:[],pw:[],who:[],grid:[]},loading:false,err:'',q:null,queue:[],found:{},sel:null,show:false,hi:1,winner:null,tl:null,max:60,rev:false,exp:false,g:null};
let iv=null,ac;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=r=>r,ptx=r=>r===1?'نقطة':r===2?'نقطتين':r+' نقط';
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.07;o.start();o.stop(ac.currentTime+d)}catch(e){}}

function paint(){document.querySelectorAll('.tv').forEach(e=>e.textContent=S.tl);document.querySelectorAll('.tf').forEach(e=>e.style.width=(S.tl/S.max*100)+'%');document.querySelectorAll('.tm').forEach(e=>e.classList.toggle('low',S.tl<=10))}
function stopT(){clearInterval(iv);iv=null;S.tl=null}
function startT(sec,cb){stopT();S.exp=false;S.max=S.tl=sec;iv=setInterval(()=>{S.tl--;paint();if(S.tl>0&&S.tl<=5)beep(700,.08);if(S.tl<=0){clearInterval(iv);iv=null;beep(200,.6);cb()}},1000);paint()}

const expR=()=>{S.exp=true;render()};
const topExp=()=>{S.rev=true;render()};
const tbox=()=>S.tl===null?'':`<div class="tm"><b class="tv">${S.tl}</b><div class="tbar"><s class="tf" style="width:${S.tl/S.max*100}%"></s></div></div>`;

// ============ إدارة المفاتيح والنماذج ============
const gk=()=>{try{return localStorage.getItem('sk_gkey')||''}catch(e){return ''}};
const gp=()=>{try{return localStorage.getItem('sk_prov')||'groq'}catch(e){return 'groq'}};
const gModel=()=>{
  try{
    const p=gp();
    const def=p==='groq'?'qwen-qwen3-32b':'gemini-3.8-flash';
    let m=localStorage.getItem('sk_model_'+p);
    if(!m) return def;
    return m.toLowerCase().replace(/\s+/g,'-').trim();
  }catch(e){return 'qwen-qwen3-32b'}
};

function saveKey(){
  const k=document.getElementById('gk').value.trim();
  const p=document.getElementById('gp').value;
  let m=document.getElementById('gm').value.trim();
  const def=p==='groq'?'qwen-qwen3-32b':'gemini-3.8-flash';
  if(!m) m=def;
  m = m.toLowerCase().replace(/\s+/g,'-').trim();
  try{
    localStorage.setItem('sk_gkey',k);
    localStorage.setItem('sk_prov',p);
    localStorage.setItem('sk_model_'+p,m);
  }catch(e){}
  const b=document.getElementById('gsv');
  if(b){b.textContent='✅ اتحفظ';setTimeout(()=>b.textContent='حفظ',2000)}
  render();
}

function setProv(p){
  document.getElementById('gp').value=p;
  const def=p==='groq'?'qwen-qwen3-32b':'gemini-3.8-flash';
  const saved=localStorage.getItem('sk_model_'+p);
  document.getElementById('gm').value=saved||def;
  const ph=p==='groq'?'gsk_...':'AIzaSy...';
  document.getElementById('gk').placeholder=ph;
}

const sleep=ms=>new Promise(z=>setTimeout(z,ms));

// ============ استدعاء Groq API (الأسرع) ============
async function askGroq(p,model){
  const key=gk();
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({
      model:model,
      messages:[{role:'user',content:p}],
      temperature:0.3,
      max_completion_tokens:2048,
      response_format:{type:'json_object'}
    })
  });
  if(!r.ok){
    let m='';try{m=(await r.json()).error?.message||r.status}catch(e){m=r.status}
    throw{message:'Groq: '+m,status:r.status};
  }
  const j=await r.json();
  const txt=j.choices?.[0]?.message?.content||'';
  return JSON.parse(txt.replace(/```json|```/g,'').trim());
}

// ============ استدعاء Gemini API (احتياطي) ============
async function askGemini(p,model){
  const key=gk();
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({
      contents:[{parts:[{text:p}]}],
      generationConfig:{responseMimeType:'application/json',temperature:0.3,maxOutputTokens:2048}
    })
  });
  if(!r.ok){
    let m='';try{m=(await r.json()).error.message}catch(e){m=r.status}
    throw{message:'Gemini: '+m,status:r.status};
  }
  const j=await r.json();
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
  return JSON.parse(txt.replace(/```json|```/g,'').trim());
}

// ============ الدالة الرئيسية مع نظام احتياطي ذكي ============
async function ask(p){
  const key=gk();
  if(!key)throw{message:'ضيف مفتاح الـ API الأول من الشاشة الرئيسية.'};
  const prov=gp();
  const model=gModel();
  
  // قائمة المحاولات: المزود الأساسي + النموذج الأساسي، ثم البدائل
  const attempts=[];
  if(prov==='groq'){
    attempts.push({fn:askGroq,m:model,n:'Groq • '+model});
    attempts.push({fn:askGroq,m:'llama-3.3-70b-versatile',n:'Groq • Llama 3.3'});
    attempts.push({fn:askGroq,m:'meta-llama/llama-4-scout',n:'Groq • Llama 4'});
  }else{
    attempts.push({fn:askGemini,m:model,n:'Gemini • '+model});
    attempts.push({fn:askGemini,m:'gemini-1.5-flash',n:'Gemini • 1.5 Flash'});
  }
  
  let lastErr=null;
  for(const a of attempts){
    for(let t=0;t<2;t++){
      const ac=new AbortController();
      const to=setTimeout(()=>ac.abort(),25000);
      try{
        const result=await Promise.race([
          a.fn(p,a.m),
          new Promise((_,rej)=>setTimeout(()=>rej({message:'timeout'}),25000))
        ]);
        clearTimeout(to);
        return result;
      }catch(e){
        clearTimeout(to);
        lastErr=e;
        if(e.status===429||e.status===503){await sleep(1500*(t+1));continue}
        break;
      }
    }
  }
  throw{message:lastErr?.message||'فشل الاتصال. جرّب تاني.'};
}

const LG=['الدوري الإنجليزي','الدوري الإسباني','الدوري الإيطالي','الدوري الألماني','الدوري الفرنسي','دوري أبطال أوروبا','كأس العالم','كأس الأمم الأفريقية','الدوري المصري','كوبا أمريكا','اليورو','دوري أبطال أفريقيا','الدوري السعودي','الدوري الهولندي','الدوري البرتغالي','الدوري التركي'];
const ER=['١٩٩٨ إلى ٢٠٠٤','٢٠٠٥ إلى ٢٠١٠','٢٠١١ إلى ٢٠١٦','٢٠١٧ إلى ٢٠٢٢','آخر ٣ سنين'];
const POS=['حراس مرمى','مدافعين','لاعبين وسط','أجنحة','مهاجمين صريحين','لاعبين انتقلوا بين أندية كثيرة'];
const ANG=['أكتر لاعبين ساهموا في أهداف (أهداف + أسيستات) في موسم معين','أصغر الهدافين سناً في بطولة','أكتر لاعبين لعبوا في أندية مختلفة','أكتر لاعبين سجلوا هاتريك','أكتر لاعبين أخدوا كروت صفرا','أكتر حراس حافظوا على نظافة شباكهم','أكتر مدربين فازوا ببطولة','أكتر لاعبين خاضوا مباريات','أكتر لاعبين سجلوا من ضربات حرة','أكتر لاعبين سجلوا أهداف في النهائيات'];
const GT=['كأس العالم','دوري أبطال أوروبا','الدوري الإنجليزي','الليجا','الكالتشو','البوندسليجا','الكرة المصرية','الكرة العربية والأفريقية','انتقالات اللاعبين','المدربين','أرقام قياسية','الجوائز الفردية','الملاعب وتاريخ الأندية','اليورو وكوبا أمريكا','حراس المرمى','أساطير من ١٩٩٨ لحد النهارده','مباريات ولحظات تاريخية','قوانين وأسرار كرة القدم'];

const usedL=(k,n)=>S.used[k].slice(-n).join(' | ')||'لسه مفيش';
const pk=(a,n=1)=>[...a].sort(()=>Math.random()-.5).slice(0,n);

const PROMPTS={
top:()=>`إنت مقدم مسابقات كرة قدم كريتيف. اعمل سؤال "توب ١٠" صعب شوية ومبتكر. 
الفكرة: ${pk(ANG)[0]}. المجال: ${pk(LG)[0]}. الفترة: ${pk(ER)[0]}. 
مهم جداً: الإجابات يجب أن تكون قصيرة ومحددة. 
مختلف عن: ${usedL('top',25)}. 
رجّع JSON بس: {"q":"عنوان السؤال بالعربي","o":"شرح الترتيب (مثال: من الأكتر للأقل)","items":[{"r":1,"n":"الاسم بالعربي","s":"الرقم أو المعلومة"}]} 
فيه ١٠ عناصر مرتبة من r=1 لـ r=10.`,

pw:()=>`هات ١٤ لاعب كرة قدم بأسمائهم بالعربي، معروفين لمتابعي الكورة المتعمقين بس مش من أشهر ٨٠ لاعب في التاريخ. 
ممنوع الأسماء الكبيرة (ميسي، رونالدو، نيمار، صلاح، مبابي، زيدان، مارادونا، بيليه، هالاند، دي بروين، مودريتش، بنزيما، روني، بيكهام، هنري، رونالدينيو). 
نوّع: ${pk(POS,2).join(' و')}، ومن فترة ${pk(ER)[0]}. 
ممنوع التكرار وممنوع الأسماء دي: ${S.used.pw.slice(-120).join('، ')||'لسه مفيش'}. 
ممنوع أي معلومات قبل سنة ١٩٩٨.
رجّع JSON بس: {"p":["الاسم",...]}`,

who:()=>`اختار لاعب كرة قدم معروف لعشاق الكورة بس مش من أشهر ٣٠ اسم في العالم، يفضّل يكون مرتبط بـ ${pk(LG)[0]} ومن فترة ${pk(ER)[0]}، ومش من دول: ${S.used.who.slice(-60).join('، ')||'لسه مفيش'}. 
اعمل "مين أنا؟" صعبة بـ ٥ هينتات بالعربي المصري من غير ذكر الاسم نهائياً. 
التدرج: ١) تفصيلة غريبة وبعيدة جداً. ٢) معلومة عن بداياته. ٣) معلومة عن مركز أو أرقام بتنطبق على عشرات اللاعبين. ٤) معلومة بتضيّق الاختيارات لكن لسه بتنطبق على أكتر من ٥ لاعبين. ٥) هينت محتاج تفكير بيضيّق الاختيارات لـ ٢ أو ٣ لاعبين بالكتير، ومتحطش فيه لقب شهير ولا لحظة أيقونية. 
ممنوع أي معلومات قبل سنة ١٩٩٨.
رجّع JSON بس: {"n":"اسم اللاعب","h":["١","٢","٣","٤","٥"]}`,

grid:()=>`أنت مقدم مسابقات كرة قدم. اعمل لعبة "الجدول" بـ ٤ كاتيجوري: ${pk(GT,4).join(' | ')}. مختلف عن: ${usedL('grid',16)}.
كل كاتيجوري فيها ٨ أسئلة: سؤالين ١٠ (سهل)، سؤالين ٢٠ (متوسط)، سؤالين ٣٠ (صعب)، سؤالين ٤٠ (صعب جداً ونادر).
ممنوع أي معلومات قبل سنة ١٩٩٨.
هام جداً لتسريع التوليد: الإجابة يجب أن تكون قصيرة جداً (كلمة أو اثنتين كحد أقصى).
رجّع JSON بس: {"cats":[{"n":"اسم الكاتيجوري","qs":[{"p":10,"q":"السؤال","a":"الإجابة"}]}]}`
};

try{const u=JSON.parse(localStorage.getItem('sk_used')||'null');if(u)for(const k in S.used)if(Array.isArray(u[k]))S.used[k]=u[k].slice(-300)}catch(e){}
function saveUsed(){try{localStorage.setItem('sk_used',JSON.stringify(S.used))}catch(e){}}

const PRE={};
function prefetch(m){if(!m||PRE[m]||!gk())return;PRE[m]=ask(PROMPTS[m]()).catch(()=>null)}

async function load(){
  stopT();S.loading=true;S.err='';S.sel=null;S.rev=false;S.exp=false;render();
  const t0=Date.now();
  clearInterval(window.lt);
  window.lt=setInterval(()=>{
    const e=document.getElementById('le');
    if(e) e.textContent=`⚡ ${Math.round((Date.now()-t0)/1000)} ثانية`;
  }, 200);
  
  try{
    let d=PRE[S.mode];
    delete PRE[S.mode];
    d=d?await d:null;
    if(!d) d=await ask(PROMPTS[S.mode]());
    
    if(S.mode==='top'){
      {const m={};(d.items||[]).forEach(it=>{const k=String(it.n).replace(/[\u064B-\u0652ـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();if(!m[k])m[k]=it});d.items=Object.values(m).sort((a,b)=>a.r-b.r).slice(0,10).map((it,i)=>({...it,r:i+1}))}
      if(!d.items||d.items.length<10)throw{message:'السؤال جه ناقص'};
      S.q=d;S.found={};S.used.top.push(d.q);startT(60,topExp);
    }else if(S.mode==='pw'){
      S.queue=d.p.filter(x=>!S.used.pw.includes(x));S.used.pw.push(...S.queue);S.show=false;
    }else if(S.mode==='who'){
      S.q=d;S.hi=1;S.show=false;S.used.who.push(d.n);startT(60,expR);
    }else{
      const cats=(d.cats||[]).slice(0,4).map(c=>({n:c.n,qs:(c.qs||[]).sort((a,b)=>a.p-b.p).slice(0,8)}));
      if(cats.length<4||cats.some(c=>c.qs.length<8))throw{message:'الجدول جه ناقص'};
      cats.forEach(c=>S.used.grid.push(c.n));
      S.g={cats,used:{},dbl:Math.floor(Math.random()*32),turn:0,cur:null,isD:false,ans:false};
    }
  }catch(e){S.err=(e&&e.message)||'حصلت مشكلة في تحميل السؤال'}
  
  clearInterval(window.lt);S.loading=false;render();
  if(!S.err)setTimeout(()=>prefetch(S.mode),200);
}

function go(m){stopT();S.mode=m;S.sc=[0,0];S.q=null;S.queue=[];S.g=null;S.winner=null;load()}
function home(){stopT();S.mode=null;S.winner=null;S.sel=null;render()}
function checkWin(){if(!GOAL[S.mode])return;[0,1].forEach(i=>{if(S.winner===null&&S.sc[i]>=GOAL[S.mode]){S.winner=i;S.w[i]++}});if(S.winner!==null)stopT()}

function pickRank(r){if(S.rev)return;S.sel=r;render()}
function assign(t){
  const r=S.sel,old=S.found[r];
  if(old!==undefined)S.sc[old]-=pts(r);
  if(t===-1)delete S.found[r];else{S.found[r]=t;S.sc[t]+=pts(r);beep(880,.15)}
  S.sel=null;checkWin();
  if(S.winner===null){S.q.items.every(it=>S.found[it.r]!==undefined)?stopT():startT(60,topExp)}
  render();
}

function got(i){
  S.sc[i]+=1;beep(880,.15);checkWin();stopT();
  if(S.winner!==null)return render();
  if(S.mode==='pw'){S.queue.shift();S.show=false;S.queue.length?render():load()}else load();
}
function skipPw(){stopT();S.queue.shift();S.show=false;S.queue.length?render():load()}
function togShow(){S.show=!S.show;S.show?startT(30,expR):stopT();render()}
function more(){if(S.hi<5){S.hi++;startT(60,expR);render()}}

function openQ(c,i){const k=c*8+i;if(S.g.used[k]!==undefined)return;S.g.cur={c,i,k};S.g.ans=false;S.g.isD=k===S.g.dbl;startT(60,expR);render()}
function backQ(){S.g.cur=null;stopT();render()}
function gAward(t){
  const g=S.g,{c,i,k}=g.cur,p=g.cats[c].qs[i].p*(g.isD?2:1);
  if(t>=0){S.sc[t]+=p;beep(880,.2)}
  g.used[k]=t;g.cur=null;g.turn^=1;stopT();
  if(Object.keys(g.used).length>=32){const[a,b]=S.sc;S.winner=a===b?2:a>b?0:1;if(S.winner<2)S.w[S.winner]++}
  render();
}

function hud(home){
  const tp=i=>`<div class="tp ${i?'b':'a'} ${S.g&&S.mode==='grid'&&S.g.turn===i&&S.winner===null?'on':''}"><span>${esc(S.t[i])}</span><b>${home?S.w[i]:S.sc[i]}</b><small>${home?'🏅 كاتيجوري':(GOAL[S.mode]?'الهدف '+GOAL[S.mode]+' • ':'')+'🏅 '+S.w[i]}</small></div>`;
  return `<div class="hud">${tp(0)}<div class="mid">${(!home&&S.tl!==null&&!(S.mode==='grid'&&S.g&&S.g.cur))?tbox():'<span class="vs">VS</span>'}</div>${tp(1)}</div>`;
}

function render(){
  if(!S.mode){
    const m=(f,i,n,s,c1,c2,c3)=>`<button class="mc" style="--c1:${c1};--c2:${c2};--c3:${c3}" onclick="pick('${f}')"><i>${i}</i><b>${n}</b><small>${s}</small></button>`;
    const prov=gp();
    const defModel=prov==='groq'?'qwen-qwen3-32b':'gemini-3.8-flash';
    const savedModel=localStorage.getItem('sk_model_'+prov);
    $.innerHTML=`<div class="logo"><b>⚽</b><h1>صباحو كورة</h1><p>⚡ أسئلة فورية — اختار اللعبة</p></div>
    <div class="card">
      <p class="mu" style="margin:0 0 8px">⚡ اختار المزود (Groq أسرع بكتير — مجاني من <b style="color:var(--g)">console.groq.com</b>)</p>
      <select id="gp" onchange="setProv(this.value)" style="width:100%;padding:12px;border-radius:14px;border:2px solid var(--bd);background:#0a1628;color:var(--tx);font:inherit;font-weight:800;margin-bottom:8px">
        <option value="groq" ${prov==='groq'?'selected':''}>⚡ Groq (الأسرع — موصى به)</option>
        <option value="gemini" ${prov==='gemini'?'selected':''}>💎 Gemini</option>
      </select>
      <input id="gk" type="password" dir="ltr" placeholder="${prov==='groq'?'gsk_...':'AIzaSy...'}" value="${esc(gk())}">
      <input id="gm" dir="ltr" value="${esc(savedModel||defModel)}" style="margin-top:8px" placeholder="${defModel}">
      <button id="gsv" class="sec w" style="margin-top:8px" onclick="saveKey()">حفظ</button>
    </div>
    <div class="card"><div class="row"><input id="n0" value="${esc(S.t[0])}" maxlength="20"><input id="n1" value="${esc(S.t[1])}" maxlength="20"></div></div>
    ${hud(true)}
    <div class="menu">${m('top','🏆','توب ١٠','رقم ١ بنقطة … رقم ١٠ بـ ١٠ نقط • أول واحد لـ ١٠٠','#f5b50a','#d97706','#92400e')}${m('pw','🔑','باسورد','كلوز للفريق من غير الاسم • أول واحد لـ ٥','#22c55e','#15803d','#14532d')}${m('who','🕵️','مين أنا؟','٥ هينتات من الغامض للواضح • أول واحد لـ ٣','#a855f7','#6d28d9','#3b0764')}${m('grid','🧩','الجدول','٤ كاتيجوري • أسئلة بـ ١٠ و٢٠ و٣٠ و٤٠ • وفيه دبل!','#3b8cff','#1d4ed8','#172554')}</div>`;
    return;
  }
  let body='',sheet='';
  const exb=S.exp?'<div class="ex">⏰ الوقت خلص!</div>':'';
  
  if(S.loading) body=`<div class="card load"><span>⚽</span><p>⚡ بنجهّز الأسئلة...</p><p class="mu" id="le" style="animation:pl 1s infinite alternate;font-size:18px">⏳</p></div>`;
  else if(S.err) body=`<div class="card"><p class="err">⚠️ ${esc(S.err)}</p><button class="w" onclick="load()">جرّب تاني</button></div>`;
  else if(S.winner!==null) body=`<div class="card win"><div style="font-size:64px">${S.winner===2?'🤝':'🏆'}</div><h2>${S.winner===2?'تعادل!':esc(S.t[S.winner])+' كسب كاتيجوري '+NAMES[S.mode]+'!'}</h2><button class="w" onclick="home()">رجوع للقايمة</button></div>`;
  else if(S.mode==='top'&&S.q){
    body=`<div class="card"><p class="q">${esc(S.q.q)}</p>${S.q.o?`<div class="ord">📊 ${esc(S.q.o)}</div>`:''}<p class="mu">دوس على الإجابة اللي اتجابت واختار الفريق</p>${S.rev?'<div class="ex">⏰ الوقت خلص! الإجابات اتكشفت</div>':''}`+
    [...S.q.items].sort((a,b)=>a.r-b.r).map(it=>{const f=S.found[it.r];const x=f===undefined&&S.rev;
      return `<button class="slot ${f!==undefined?'f '+(f?'b':'a'):x?'f x':''} ${it.r>=8?'k':''}" onclick="pickRank(${it.r})"><i>${it.r}</i>${esc(it.n)}<u>${ptx(it.r)}</u><em>${esc(it.s)}</em></button>`}).join('')+
    `<button class="sec w" onclick="load()" style="margin-top:6px">سؤال جديد ▶</button></div>`;
    if(S.sel!==null){const it=S.q.items.find(x=>x.r===S.sel),f=S.found[S.sel];
      sheet=`<div class="ov" onclick="S.sel=null;render()"><div class="sheet" onclick="event.stopPropagation()"><h3>${esc(it.n)}</h3><p class="mu">رقم ${it.r} — ${ptx(it.r)}. مين جاوبها؟</p>
      <div class="row"><button class="ta" onclick="assign(0)">${esc(S.t[0])}</button><button class="tb" onclick="assign(1)">${esc(S.t[1])}</button></div>
      ${f!==undefined?`<button class="sec w" style="margin-top:12px" onclick="assign(-1)">إلغاء الإجابة</button>`:''}</div></div>`;}
  }else if(S.mode==='pw'&&S.queue.length){
    body=`<div class="card"><p class="mu">اتنين (واحد من كل فريق) يشوفوا الاسم ويدّوا كلوز لفريقهم من غير ما يقولوا الاسم — ٣٠ ثانية لكل كلو</p>
    <div class="big">${S.show?esc(S.queue[0]):'🙈 ••••••'}</div>${exb}
    <div class="row" style="margin-bottom:12px"><button class="sec" onclick="togShow()">${S.show?'اخفي الاسم':'اظهر الاسم وابدأ ⏱'}</button>${S.show?'<button class="sec" onclick="startT(30,expR);render()">كلو جديد ⏱</button>':''}</div>
    <p class="mu">مين جاب الاسم؟</p>
    <div class="row"><button class="ta" onclick="got(0)">${esc(S.t[0])}</button><button class="tb" onclick="got(1)">${esc(S.t[1])}</button></div>
    <button class="sec w" onclick="skipPw()" style="margin-top:12px">محدش جابه — التالي</button></div>`;
  }else if(S.mode==='who'&&S.q){
    body=`<div class="card"><div class="dots">${[1,2,3,4,5].map(i=>`<s class="${i<=S.hi?'on':''}"></s>`).join('')}</div>`+
    S.q.h.slice(0,S.hi).map((h,i)=>`<div class="hint"><b>${i+1}</b><span>${esc(h)}</span></div>`).join('')+exb+
    (S.show?`<div class="big">${esc(S.q.n)}</div>`:'')+
    `<p class="mu">لما حد يجاوب صح:</p>
    <div class="row"><button class="ta" onclick="got(0)">${esc(S.t[0])} جاب</button><button class="tb" onclick="got(1)">${esc(S.t[1])} جاب</button></div>
    <div class="row" style="margin-top:12px">${S.hi>=5?'':'<button class="sec" onclick="more()">هينت أوضح ▶</button>'}<button class="sec" onclick="${S.show?'load()':'stopT();S.show=true;render()'}">${S.show?'لاعب جديد':'اكشف الاسم'}</button></div></div>`;
  }else if(S.mode==='grid'&&S.g){
    const g=S.g;
    body=`<p class="mu">الدور على: <b style="color:var(--gold)">${esc(S.t[g.turn])}</b> — اختار خانة (فيه خانة واحدة مخبّية دبل 🔥)</p><div class="gb">`+
    g.cats.map((c,ci)=>`<div class="gc"><div class="gh">${esc(c.n)}</div>`+c.qs.map((q,i)=>{const k=ci*8+i,u=g.used[k];
      return `<button class="tile ${u===undefined?'':'u '+(u<0?'x':u?'b':'a')}" data-p="${q.p}" ${u===undefined?'':'disabled'} onclick="openQ(${ci},${i})">${u===undefined?q.p:(u<0?'✖':q.p*(k===g.dbl?2:1))}</button>`}).join('')+`</div>`).join('')+`</div>`;
    if(g.cur){const c=g.cats[g.cur.c],q=c.qs[g.cur.i];
      sheet=`<div class="ov"><div class="sheet"><div class="qh"><span>${esc(c.n)}</span><span class="pt">${q.p}${g.isD?' ×٢':''}</span></div>
      ${g.isD?'<div class="dbl">🔥 دبل بوينتس! النقط ×٢ 🔥</div>':''}
      <div style="width:130px;margin:8px auto 0">${tbox()}</div>${exb}
      <p class="qq">${esc(q.q)}</p>
      ${g.ans?`<div class="ans">${esc(q.a)}</div>`:`<button class="sec w" onclick="S.g.ans=true;stopT();render()">اكشف الإجابة</button>`}
      <p class="mu">مين جاوب صح؟ (${q.p*(g.isD?2:1)} نقطة)</p>
      <div class="row"><button class="ta" onclick="gAward(0)">${esc(S.t[0])}</button><button class="tb" onclick="gAward(1)">${esc(S.t[1])}</button></div>
      <div class="row" style="margin-top:12px"><button class="sec" onclick="gAward(-1)">محدش جاوب</button><button class="sec" onclick="backQ()">رجوع</button></div></div></div>`;}
  }
  $.innerHTML=`<div class="top"><button class="sec" onclick="home()">→ القايمة</button><b>${NAMES[S.mode]}</b><span style="width:92px"></span></div>`+hud(false)+body+sheet;
  paint();
}

function pick(m){
  const a=document.getElementById('n0'),b=document.getElementById('n1');
  saveKey();S.t=[a.value.trim()||'الفريق الأحمر',b.value.trim()||'الفريق الأزرق'];
  go(m);
}

const _r=render;
render=function(){
  saveUsed();
  _r();
  if(S.winner===null) S.cf=0;
  else if(S.winner<2 && !S.cf){
    S.cf=1;
    const c=['#ffc928','#22e07a','#ff4b55','#3b8cff','#a855f7'];
    for(let i=0;i<50;i++){
      const e=document.createElement('i');
      e.className='cf';
      e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*2}s`;
      document.body.appendChild(e);
      setTimeout(()=>e.remove(),5000);
    }
    beep(660,.15);
    setTimeout(()=>beep(880,.25),180);
  }
};

render();
</script>
</body>
</html>
