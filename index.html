<!DOCTYPE html>

<head>

<style>

.slot.f{color:#fff;border-color:transparent}.slot.f i{background:#fff3;color:#fff}.slot.f em{color:#fffd}
.slot.f.a{background:linear-gradient(90deg,var(--a),var(--a2))}.slot.f.b{background:linear-gradient(90deg,var(--b),var(--b2))}.slot.f.x{background:#2a3a55;opacity:.8}
.big{font-size:32px;font-weight:900;text-align:center;padding:24px 8px;background:#0a1628;border:3px dashed var(--bd);border-radius:18px;margin:10px 0;color:var(--gold)}

.dots s{width:34px;height:9px;border-radius:9px;background:#1c3358}.dots s.on{background:var(--g);box-shadow:0 0 10px var(--g)}
.hint{display:flex;gap:10px;padding:12px;border-radius:14px;background:#0a1628;border:1px solid var(--bd);margin-bottom:8px;font-weight:500}

.ex{background:var(--a);color:#fff;text-align:center;font-weight:900;border-radius:12px;padding:6px;margin:8px 0;animation:pl .5s 4 alternate}

.load{text-align:center;color:var(--mu);padding:30px 10px}.load span{display:inline-block;font-size:44px;animation:bn .7s infinite alternate}

.gc{display:flex;flex-direction:column;gap:6px}
.gh{background:linear-gradient(180deg,#1d3a66,#12264a);border:2px solid var(--bd);border-radius:12px;padding:6px 3px;text-align:center;font-weight:900;font-size:12px;min-height:50px;display:grid;place-items:center;line-height:1.25}
.tile{--c:#22c55e;padding:0;height:44px;font-size:20px;color:#fff;border-radius:12px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#000);text-shadow:0 2px 0 #0004}
.tile[data-p="20"]{--c:#3b8cff}.tile[data-p="30"]{--c:#a855f7}.tile[data-p="40"]{--c:#f97316}
.tile.u{box-shadow:none;transform:translateY(4px);font-size:14px;opacity:.9}
.tile.u.a{background:var(--a2)}.tile.u.b{background:var(--b2)}.tile.u.x{background:#223}
.ov{position:fixed;inset:0;background:rgba(2,6,14,.75);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:linear-gradient(180deg,#16294a,#0d1a31);border:2px solid var(--bd);border-bottom:0;width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{margin:0 0 2px;text-align:center;font-size:22px;font-weight:900}
.qh{display:flex;justify-content:space-between;font-weight:900;color:var(--mu)}.qh .pt{color:var(--gold);font-size:22px}
.dbl{background:linear-gradient(90deg,#ff7a00,#ffc928);color:#2b1700;text-align:center;font-weight:900;border-radius:12px;padding:6px;margin:8px 0;animation:pl .5s infinite alternate}
.qq{font-size:22px;font-weight:900;text-align:center;margin:12px 0}
.ans{background:#0a1628;border:2px solid var(--g);color:var(--g);border-radius:14px;text-align:center;font-size:24px;font-weight:900;padding:12px;margin:8px 0}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background:radial-gradient(circle at 50% 38%,transparent 0 78px,#fff 78px 81px,transparent 81px),linear-gradient(#fff,#fff) 0 38%/100% 3px no-repeat}
.card{backdrop-filter:blur(6px);box-shadow:0 10px 30px #0006,inset 0 1px 0 #ffffff14}
.logo h1{font-size:52px;letter-spacing:-1px}.logo b{font-size:48px;filter:drop-shadow(0 6px 8px #000a)}
.tp:before{content:"🛡️";display:block;font-size:18px;line-height:1.1}
.tp b{text-shadow:0 0 14px #fff6,0 3px 0 #0004}
.mc{position:relative;overflow:hidden;animation:fl 3s ease-in-out infinite alternate}
.mc:nth-child(2){animation-delay:-.7s}.mc:nth-child(3){animation-delay:-1.4s}.mc:nth-child(4){animation-delay:-2.1s}
.mc:before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,#ffffff40,transparent)}
.mc:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-24px;bottom:-30px;background:#ffffff1c}
.mc>*{position:relative;z-index:1}
@keyframes fl{to{transform:translateY(-5px)}}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.slot,.hint{animation:in .28s both}.hint{border-inline-start:4px solid var(--g)}
.tile{position:relative;overflow:hidden;animation:pop .35s both}
.tile:not(.u):after{content:"";position:absolute;inset:3px 3px 52% 3px;border-radius:9px;background:linear-gradient(#fff5,transparent);pointer-events:none}
.tile:not(.u):hover{filter:brightness(1.15)}
.gh{background:linear-gradient(180deg,#2a5aa0,#16336a);box-shadow:0 4px 0 #0a1a38;text-shadow:0 2px 0 #0005;border-color:#4a7bc0}
.sheet:before{content:"";display:block;width:46px;height:5px;border-radius:9px;background:#fff3;margin:0 auto 10px}
button.sec{border:1px solid #2f4d7c}
.top b{text-shadow:0 0 16px #ffc92877}
.win>div:first-child{animation:bn .6s infinite alternate}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ord{background:#0a1628;border:2px solid var(--gold);color:var(--gold);border-radius:12px;text-align:center;font-weight:900;padding:6px 10px;margin:6px 0}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{font-size:12px;padding:6px 10px;border-radius:99px;background:#0a1628;border:2px solid var(--bd);color:var(--mu);font-weight:800;box-shadow:none;cursor:pointer}
.mchip:active{transform:none;box-shadow:none}
.mchip.on{border-color:var(--g);color:var(--g);background:#0f2a1e}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800;font-size:14px;color:var(--mu);cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--g);flex:none}
.tip{background:#0a1628;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--mu);line-height:1.5}
.rnd{display:inline-block;font-size:12px;background:#0007;border-radius:99px;padding:2px 10px;color:var(--gold);font-weight:900;margin-inline-start:6px}
.eq{background:#0a1628;border:1px solid var(--bd);border-radius:14px;padding:8px;margin-bottom:8px}
.eq input,.eq textarea{margin-top:6px}
.ehead{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:var(--mu);font-size:13px}
.ehead b{color:var(--gold)}
.catEdit{margin-bottom:14px;border:2px solid var(--bd);border-radius:16px;padding:10px;background:#0d1a31}
.catEdit>input{margin-bottom:8px;text-align:right}
</style>

<body>
<div id="app"></div>
<script>
const $=document.getElementById('app');
const GOAL={top:100,pw:5,who:3};
const NAMES={top:'توب ١٠',pw:'باسورد',who:'مين أنا؟',grid:'الجدول'};
const S={t:['الفريق الأحمر','الفريق الأزرق'],w:[0,0],sc:[0,0],mode:null,used:{top:[],pw:[],who:[],grid:[]},loading:false,err:'',q:null,queue:[],found:{},sel:null,show:false,hi:1,winner:null,tl:null,max:60,rev:false,exp:false,g:null,strict:false,gridEdit:false,fast:true,editGrid:false,round:0,flash:null};
let iv=null,ac,flashTo=null;

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=r=>r,ptx=r=>r===1?'نقطة':r===2?'نقطتين':r+' نقط';

const HEDGE_PATTERNS=[
  /تقريب[اً]?\s*[\d٠-٩]/,
  /حوالي\s*[\d٠-٩]/,
  /من المحتمل/,
  /يُقال|بيقال|يقال إن/,
  /(^|\s)ربما(\s|$)/,
  /قد يكون/,
  /في الغالب/,
  /أكثر من المحتمل/,
  /approximately|probably|perhaps|roughly|circa/i,
  /(around|about)\s+\d/i,
  /\blikely\b/i
];
const hasHedge=s=>HEDGE_PATTERNS.some(re=>re.test(String(s||'')));

function topLooksGood(d){
  if(!d||!Array.isArray(d.items)||d.items.length<10)return false;
  const fields=[d.q,d.o].concat(d.items.flatMap(it=>[it.n,it.s,it.y]));
  if(fields.some(hasHedge))return false;
  const sorted=[...d.items].sort((a,b)=>(parseInt(a.r)||99)-(parseInt(b.r)||99));
  const nums=sorted.map(it=>{
    const m=String(it.s||'').match(/-?\d+(?:[.,]\d+)?/);
    return m?parseFloat(m[0].replace(',','.')):null;
  });
  if(nums.every(n=>n!==null)){
    for(let i=1;i<nums.length;i++){
      if(nums[i]>nums[i-1]+0.001)return false;
    }
  }
  return true;
}

function gridLooksGood(d){
  if(!d||!Array.isArray(d.cats)||d.cats.length<4)return false;
  for(const c of d.cats){
    if(!c.n||!Array.isArray(c.qs)||c.qs.length<8)return false;
    if(hasHedge(c.n))return false;
    for(const q of c.qs){
      if(!q.q||!q.a)return false;
      if(hasHedge(q.q)||hasHedge(q.a))return false;
    }
  }
  return true;
}

function trySortByS(items){
  const nums=items.map(it=>{
    const m=String(it.s||'').match(/-?\d+(?:[.,]\d+)?/);
    return m?parseFloat(m[0].replace(',','.')):null;
  });
  if(nums.some(n=>n===null))return items;
  return [...items].map((it,i)=>({it,v:nums[i]}))
    .sort((a,b)=>b.v-a.v)
    .map((x,i)=>({...x.it,r:i+1}));
}

function beep(f,d){
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.value=.07;o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

function paint(){
  document.querySelectorAll('.tv').forEach(e=>e.textContent=S.tl);
  document.querySelectorAll('.tf').forEach(e=>e.style.width=(S.tl/S.max*100)+'%');
  document.querySelectorAll('.tm').forEach(e=>e.classList.toggle('low',S.tl<=10));
}

function stopT(){clearInterval(iv);iv=null;S.tl=null}

function startT(sec,cb){
  stopT();
  S.exp=false;
  S.max=S.tl=sec;
  iv=setInterval(()=>{
    S.tl--;
    paint();
    if(S.tl>0&&S.tl<=5)beep(700,.08);
    if(S.tl<=0){
      clearInterval(iv);
      iv=null;
      beep(200,.6);
      cb();
    }
  },1000);
  paint();
}

const expR=()=>{S.exp=true;render()};

const topExp=()=>{
  S.round++;
  S.flash='⏰ الوقت خلص — بدأت جولة جديدة #'+(S.round+1)+'، كمّل اختيار!';
  startT(60,topExp);
  render();
  clearTimeout(flashTo);
  flashTo=setTimeout(()=>{
    S.flash=null;
    const f=document.getElementById('flash');
    if(f)f.remove();
  },2800);
};

function topPause(){
  if(!S.q)return;
  const all=S.q.items.every(it=>S.found[it.r]!==undefined);
  if(all){
    stopT();
    S.rev=true;
    render();
    return;
  }
  S.rev=!S.rev;
  if(S.rev)stopT();
  else startT(60,topExp);
  render();
}

const tbox=()=>S.tl===null?'':`<div class="tm"><b class="tv">${S.tl}</b><div class="tbar"><s class="tf" style="width:${S.tl/S.max*100}%"></s></div></div>`;

const LS=(k,v)=>{
  try{
    if(v===undefined)return localStorage.getItem(k);
    localStorage.setItem(k,v);
  }catch(e){}
  return null;
};

S.strict=LS('sk_strict')==='1';
S.gridEdit=LS('sk_grid_edit')==='1';
S.fast=LS('sk_fast')!=='0';

const gk=()=>LS('sk_gemini_key')||'';
const gm=()=>LS('sk_gemini_model')||'gemini-2.5-flash';
const gModels=()=>{
  try{return JSON.parse(LS('sk_gemini_models')||'[]')}catch(e){return []}
};

async function fetchAvailable(){
  const key=gk();
  if(!key) throw {message:'ضيف المفتاح الأول'};

  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
  const j=await r.json();
  if(!r.ok) throw {message:(j.error&&j.error.message)||r.status};
  return (j.models||[])
    .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>m.name.replace('models/',''))
    .filter(n=>/flash|pro|lite/i.test(n));
}

function rankModels(list){
  const score=id=>{
    let s=0;
    const l=id.toLowerCase();

    if(/gemini-3.*flash/.test(l)) s+=140;
    if(/gemini-2\.5-flash/.test(l)) s+=130;
    if(/gemini-2\.0-flash/.test(l)) s+=120;
    if(/gemini-flash-latest/.test(l)) s+=115;
    if(/gemini-1\.5-flash/.test(l)) s+=100;
    if(/gemini-2.*flash/.test(l)&&!/lite/.test(l)) s+=90;
    if(/gemini.*pro/.test(l)) s+=40;
    if(/lite/.test(l)) s-=15;
    if(/-exp|-preview|-experimental/.test(l)) s-=25;
    if(/thinking|embedding|aqa|vision|audio|video/i.test(l)) s-=50;

    return s;
  };

  return [...new Set(list)].sort((a,b)=>score(b)-score(a));
}

async function refreshModels(silent){
  const o=document.getElementById('gst');
  if(!silent&&o) o.textContent='⏳ بجيب الموديلات المتاحة لمفتاحك...';

  try{
    const list=rankModels(await fetchAvailable());
    LS('sk_gemini_models',JSON.stringify(list));

    if(list.length && (!gm()||!list.includes(gm()))) LS('sk_gemini_model',list[0]);

    if(o){
      o.textContent=list.length
        ?('✅ لقينا '+list.length+' موديل شغال — المختار: '+(gm()||list[0]))
        :'⚠️ مفيش موديلات متاحة للمفتاح ده';
    }

    if(!silent) render();
    return list;
  }catch(e){
    if(o) o.textContent='❌ '+(e.message||e);
    return [];
  }
}

function saveKey(silent){
  const k=document.getElementById('gk').value.trim();
  LS('sk_gemini_key',k);

  const b=document.getElementById('gsv');
  if(b){
    b.textContent='✅ اتحفظ';
    setTimeout(()=>{b.textContent='حفظ'},1500);
  }

  refreshModels(!!silent);
}

function chooseModel(m){LS('sk_gemini_model',m);render()}
function togStrict(v){S.strict=v;LS('sk_strict',v?'1':'0')}
function togGridEdit(v){S.gridEdit=v;LS('sk_grid_edit',v?'1':'0')}
function togFast(v){S.fast=v;LS('sk_fast',v?'1':'0')}

const sleep=ms=>new Promise(z=>setTimeout(z,ms));

const FACT_RULES=`Today is 2026. Use only verified football facts from 1998 through 2026. No invented stats, dates, names, rankings, or numbers. NO HEDGING WORDS. Exact numbers/facts only. All user-facing strings in Egyptian Arabic. Return compact valid JSON only.`;

async function once(model,p,big,sig,key){
  const isGrid=p.includes('"cats"');
  const isTop=p.includes('"items"');
  const baseMax=isGrid?4800:(isTop?3000:1200);

  const configs=[
    {temperature:0,maxOutputTokens:baseMax,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}},
    {temperature:0,maxOutputTokens:baseMax,responseMimeType:'application/json'},
    {temperature:0.1,maxOutputTokens:baseMax+1000,responseMimeType:'application/json'}
  ];

  let lastErr=null;

  for(const genCfg of configs){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
        method:'POST',
        signal:sig,
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({
          contents:[{parts:[{text:FACT_RULES+'\n'+p}]}],
          generationConfig:genCfg
        })
      });

      if(!r.ok){
        let m='';
        try{
          const j=await r.json();
          m=(j.error&&j.error.message)||JSON.stringify(j).slice(0,300);
        }catch(e){}
        const err={message:'Gemini: '+(m||r.status),status:r.status};
        if(r.status===400 && /thinking|responseMimeType|generationConfig|schema|temperature/i.test(m)){
          lastErr=err;
          continue;
        }
        throw err;
      }

      const j=await r.json();

      if(j.promptFeedback&&j.promptFeedback.blockReason){
        throw {message:'Gemini: السؤال اتحجب بسبب السلامة ('+j.promptFeedback.blockReason+')',status:451};
      }

      const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content?j.candidates[0].content.parts:[])
        .filter(x=>!x.thought)
        .map(x=>x.text||'')
        .join(''));

      let clean=txt.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```json|```/g,'').trim();

      let out=null;
      try{
        out=JSON.parse(clean);
      }catch(e){
        const a=clean.indexOf('{'),b=clean.lastIndexOf('}');
        if(a>-1&&b>a){
          try{out=JSON.parse(clean.slice(a,b+1))}catch(e2){}
        }
      }

      if(out) return out;

      lastErr={message:'Gemini: JSON طلع غير صالح',status:0,jsonError:true};
    }catch(e){
      if(e.name==='AbortError') throw e;
      if(e.status===400 && /thinking|responseMimeType|generationConfig|schema|temperature/i.test(String(e.message||''))){
        lastErr=e;
        continue;
      }
      throw e;
    }
  }

  throw lastErr||{message:'Gemini: فشل'};
}

async function ask(p,tmo){
  const key=gk();
  if(!key) throw {message:'ضيف مفتاح Google Gemini الأول من الشاشة الرئيسية.'};

  const big=p.includes('"cats"')||p.includes('"items"');

  if(tmo==null) tmo=S.fast?(big?35000:18000):(big?60000:35000);

  const avail=gModels();
  const chosen=gm();
  const models=[...new Set([chosen,...avail].filter(Boolean))];

  if(!models.length){
    await refreshModels(true);
    models.push(...gModels());
  }

  if(!models.length) models.push(chosen||'gemini-2.5-flash');

  let last=null;
  const attempts=S.fast?1:2;

  for(const m of models){
    for(let t=0;t<attempts;t++){
      const ctrl=new AbortController();
      const to=setTimeout(()=>ctrl.abort(),tmo);

      try{
        const d=await once(m,p,big,ctrl.signal,key);
        clearTimeout(to);
        if(m!==chosen) LS('sk_gemini_model',m);
        return d;
      }catch(err){
        clearTimeout(to);
        last=err;

        const msg=String(err&&err.message||'');

        if(err&&err.name==='AbortError'){
          if(t<attempts-1)continue;
          break;
        }

        if(err&&(err.status===401||err.status===403)){
          throw {message:'المفتاح غلط أو مش شغال.'};
        }

        if(err&&(err.status===429||err.status===503)){
          await sleep(S.fast?900*(t+1):2500*(t+1));
          continue;
        }

        if(err&&err.status===400&&/response_format|json_object|json_schema|schema|additionalProperties|required|thinking|responseMimeType|generationConfig/i.test(msg)){
          if(t<attempts-1)continue;
          break;
        }

        if(err&&(err.status===404||/does not exist|not have access|not found|unsupported/i.test(msg))){
          break;
        }

        if(err&&err.jsonError){
          if(t<attempts-1)continue;
          break;
        }

        if(t<attempts-1)continue;
        break;
      }
    }
  }

  throw {message:(last&&last.message)||'فشل الاتصال. جرّب تاني.'};
}

async function review(mode,d){
  const json=JSON.stringify(d);

  if(mode==='grid'){
    const p='راجع الجدول ده كمُدقق كرة قدم صارم. صلح أي خطأ، أي حاجة قبل 1998، أي كلام تقريبي، أي إجابة مش حصرية، أو أي صعوبة مش مظبوطة. حافظ على نفس هيكل JSON بالضبط. رجّع JSON فقط بدون شرح.\n\nJSON:\n'+json;
    return await ask(p,S.fast?50000:75000);
  }

  const p='راجع التوب 10 ده كمُدقق كرة قدم صارم. تأكد من الأسماء، القيم، السنوات، اتجاه الترتيب، وأن r=1 هو الأكبر أو الأحدث حسب السؤال. صلح أي خطأ أو استبدل السؤال بحقيقة أكثر توثيقًا لو فيه شك. حافظ على نفس هيكل JSON بالضبط. رجّع JSON فقط بدون شرح.\n\nJSON:\n'+json;
  return await ask(p,S.fast?45000:65000);
}

function normalizeTop(d){
  if(!d||!Array.isArray(d.items)) throw {message:'السؤال جه ناقص'};

  const map={};

  d.items.forEach(it=>{
    const name=String(it.n||'').trim();
    if(!name)return;

    const key=name
      .replace(/[\u064B-\u0652ـ]/g,'')
      .replace(/[أإآ]/g,'ا')
      .replace(/ة/g,'ه')
      .replace(/ى/g,'ي')
      .replace(/\s+/g,' ')
      .toLowerCase();

    if(!map[key]) map[key]=it;
  });

  let items=Object.values(map)
    .sort((a,b)=>(parseInt(a.r)||99)-(parseInt(b.r)||99))
    .slice(0,10)
    .map((it,i)=>({
      r:i+1,
      n:String(it.n||'').trim(),
      s:String(it.s||'').trim(),
      y:String(it.y||'').trim()
    }));

  if(items.length<10) throw {message:'السؤال جه ناقص ('+items.length+'/10)'};
  if(items.some(it=>!it.n)) throw {message:'في اسم فاضي في التوب 10'};
  if(items.some(it=>hasHedge(it.n)||hasHedge(it.s))) throw {message:'السؤال فيه كلام تقريبي'};

  items=trySortByS(items);

  return {
    q:String(d.q||'سؤال توب 10').trim(),
    o:String(d.o||'').trim(),
    items
  };
}

function normalizeGrid(d){
  if(!d||!Array.isArray(d.cats)) throw {message:'الجدول جه ناقص'};

  const cats=d.cats.slice(0,4).map(c=>{
    let qs=(c.qs||[]).slice();

    qs.sort((a,b)=>(parseInt(a.p)||0)-(parseInt(b.p)||0));

    if(qs.length<8) throw {message:'الجدول جه ناقص'};

    const forcedP=[10,10,20,20,30,30,40,40];

    qs=qs.slice(0,8).map((q,i)=>({
      p:forcedP[i],
      q:String(q.q||'').trim(),
      a:String(q.a||'').trim()
    }));

    if(qs.some(q=>!q.q||!q.a)) throw {message:'في سؤال أو إجابة فاضية في الجدول'};

    return {
      n:String(c.n||'عام').trim(),
      qs
    };
  });

  if(cats.length<4) throw {message:'الجدول جه ناقص'};

  return cats;
}

async function load(){
  stopT();
  S.loading=true;
  S.err='';
  S.sel=null;
  S.rev=false;
  S.exp=false;
  S.round=0;
  S.flash=null;
  S.editGrid=false;
  render();

  const t0=Date.now();
  clearInterval(window.lt);
  window.lt=setInterval(()=>{
    const e=document.getElementById('le');
    if(e) e.textContent=Math.round((Date.now()-t0)/1000)+' ثانية';
  },500);

  const setLoading=(t)=>{const e=document.getElementById('le');if(e)e.textContent=t};

  try{
    if(S.mode==='top'){
      let d=PRE.top; delete PRE.top;
      d=d?await d:null;
      if(!d) d=await ask(PROMPTS.top());

      if(S.strict){
        setLoading('🔍 براجع دقة التوب 10...');
        try{
          const r=await review('top',d);
          if(r&&topLooksGood(r)) d=r;
        }catch(e){}
      }

      let q;
      try{
        q=normalizeTop(d);
      }catch(e){
        setLoading('🔄 بجيب سؤال تاني...');
        d=await ask(PROMPTS.top());
        q=normalizeTop(d);
      }

      S.q=q;
      S.found={};
      S.used.top.push(q.q);
      startT(60,topExp);

    }else if(S.mode==='pw'){
      let d=PRE.pw; delete PRE.pw;
      d=d?await d:null;
      if(!d) d=await ask(PROMPTS.pw());

      if(!d||!Array.isArray(d.p)) throw {message:'الرد جه غلط، جرّب تاني'};

      S.queue=[...new Set(d.p.map(x=>String(x||'').trim()).filter(x=>x&&!S.used.pw.includes(x)))];

      if(!S.queue.length){
        S.queue=[...new Set(d.p.map(x=>String(x||'').trim()).filter(Boolean))];
        S.used.pw=[];
      }

      if(!S.queue.length) throw {message:'مفيش أسماء جديدة، جرّب تاني'};

      S.used.pw.push(...S.queue);
      S.show=false;

    }else if(S.mode==='who'){
      let d=PRE.who; delete PRE.who;
      d=d?await d:null;
      if(!d) d=await ask(PROMPTS.who());

      if(!d||!d.n||!Array.isArray(d.h)||d.h.length<5) throw {message:'اللغز جه ناقص'};

      S.q={
        n:String(d.n||'').trim(),
        h:d.h.map(x=>String(x||'').trim()).filter(Boolean).slice(0,5)
      };

      if(!S.q.n||S.q.h.length<5) throw {message:'اللغز جه ناقص'};

      S.hi=1;
      S.show=false;
      S.used.who.push(S.q.n);
      startT(60,expR);

    }else{
      let d=PRE.grid; delete PRE.grid;
      d=d?await d:null;
      if(!d) d=await ask(PROMPTS.grid());

      if(S.strict){
        setLoading('🔍 براجع دقة الجدول...');
        try{
          const r=await review('grid',d);
          if(r&&gridLooksGood(r)) d=r;
        }catch(e){}
      }

      let cats;
      try{
        cats=normalizeGrid(d);
      }catch(e){
        setLoading('🔄 بجيب جدول تاني...');
        d=await ask(PROMPTS.grid());
        cats=normalizeGrid(d);
      }

      cats.forEach(c=>S.used.grid.push(c.n));

      S.g={
        cats,
        used:{},
        dbl:Math.floor(Math.random()*32),
        turn:0,
        cur:null,
        isD:false,
        ans:false
      };

      if(S.gridEdit) S.editGrid=true;
    }

  }catch(e){
    S.err=(e&&e.message)||'حصلت مشكلة في تحميل السؤال';
  }

  clearInterval(window.lt);
  S.loading=false;
  render();

  if(!S.err) setTimeout(()=>prefetch(S.mode),200);
}

function checkWin(){
  if(!GOAL[S.mode])return;
  [0,1].forEach(i=>{
    if(S.winner===null&&S.sc[i]>=GOAL[S.mode]){
      S.winner=i;
      S.w[i]++;
    }
  });
  if(S.winner!==null)stopT();
}

function assign(t){
  const r=S.sel,old=S.found[r];

  if(old!==undefined)S.sc[old]-=pts(r);

  if(t===-1){
    delete S.found[r];
  }else{
    S.found[r]=t;
    S.sc[t]+=pts(r);
    beep(880,.15);
  }

  S.sel=null;
  checkWin();

  if(S.winner===null){
    const all=S.q.items.every(it=>S.found[it.r]!==undefined);
    if(all||S.rev) stopT();
    else startT(60,topExp);
  }

  render();
}

function got(i){
  S.sc[i]+=1;
  beep(880,.15);
  checkWin();
  stopT();

  if(S.winner!==null)return render();

  if(S.mode==='pw'){
    S.queue.shift();
    S.show=false;
    S.queue.length?render():load();
  }else{
    load();
  }
}

  S.g.isD=k===S.g.dbl;
  startT(60,expR);

function gAward(t){
  const g=S.g;
  const {c,i,k}=g.cur;
  const p=g.cats[c].qs[i].p*(g.isD?2:1);

  if(t>=0){
    S.sc[t]+=p;
    beep(880,.2);
  }

  g.used[k]=t;
  g.cur=null;
  g.turn^=1;
  stopT();

  if(Object.keys(g.used).length>=32){
    const [a,b]=S.sc;
    S.winner=a===b?2:a>b?0:1;
    if(S.winner<2) S.w[S.winner]++;
  }

  render();
}

  }else if(S.mode==='top'&&S.q){
    const left=S.q.items.filter(it=>S.found[it.r]===undefined).length;

    body=`<div class="card">
      <p class="q">${esc(S.q.q)}${S.round>0?`<span class="rnd">جولة #${S.round+1}</span>`:''}</p>
      ${S.q.o?`<div class="ord">📊 ${esc(S.q.o)}</div>`:''}
      ${S.flash?`<div class="flash" id="flash">${esc(S.flash)}</div>`:''}
      ${S.rev?'<div class="ex">⏸ الوقت موقوف — دوس استئناف كمّل</div>':''}
      <p class="mu">فاضل ${left} إجابة — دوس على الإجابة اللي اتجاوبت واختار الفريق</p>`+
      [...S.q.items].sort((a,b)=>a.r-b.r).map(it=>{
        const f=S.found[it.r];
        return `<button class="slot ${f!==undefined?'f '+(f?'b':'a'):''} ${it.r>=8?'k':''}" onclick="pickRank(${it.r})"><i>${it.r}</i>${esc(it.n)}<u>${ptx(it.r)}</u><em>${esc(it.s||'')}</em></button>`;
      }).join('')+
      `<div class="row" style="margin-top:6px">
        <button class="sec" onclick="load()">سؤال جديد ▶</button>
        <button class="sec" onclick="topPause()">${S.rev?'▶ استئناف الوقت':'⏸ إيقاف الوقت'}</button>
      </div>
    </div>`;

    if(S.sel!==null){
      const it=S.q.items.find(x=>x.r===S.sel);
      const f=S.found[S.sel];

      sheet=`<div class="ov" onclick="S.sel=null;render()">
        <div class="sheet" onclick="event.stopPropagation()">
          <h3>${esc(it.n)}</h3>
          <p class="mu">رقم ${it.r} — ${ptx(it.r)}. ${esc(it.s||'')}<br>مين جاوبها؟</p>
          <div class="row">
            <button class="ta" onclick="assign(0)">${esc(S.t[0])}</button>
            <button class="tb" onclick="assign(1)">${esc(S.t[1])}</button>
          </div>
          ${f!==undefined?`<button class="sec w" style="margin-top:12px" onclick="assign(-1)">إلغاء الإجابة</button>`:''}
        </div>
      </div>`;
    }

  }else if(S.mode==='pw'&&S.queue.length){
    body=`<div class="card">
      <p class="mu">اتنين (واحد من كل فريق) يشوفوا الاسم ويدّوا كلوز لفريقهم من غير ما يقولوا الاسم — 30 ثانية لكل كلو</p>
      <div class="big">${S.show?esc(S.queue[0]):'🙈 ••••••'}</div>
      ${exb}
      <div class="row" style="margin-bottom:12px">
        <button class="sec" onclick="togShow()">${S.show?'اخفي الاسم':'اظهر الاسم وابدأ ⏱'}</button>
        ${S.show?'<button class="sec" onclick="startT(30,expR);render()">كلو جديد ⏱</button>':''}
      </div>
      <p class="mu">مين جاب الاسم؟</p>
      <div class="row">
        <button class="ta" onclick="got(0)">${esc(S.t[0])}</button>
        <button class="tb" onclick="got(1)">${esc(S.t[1])}</button>
      </div>
      <button class="sec w" onclick="skipPw()" style="margin-top:12px">محدش جابه — التالي</button>
    </div>`;

  }else if(S.mode==='who'&&S.q){
    body=`<div class="card">
      <div class="dots">${[1,2,3,4,5].map(i=>`<s class="${i<=S.hi?'on':''}"></s>`).join('')}</div>`+
      S.q.h.slice(0,S.hi).map((h,i)=>`<div class="hint"><b>${i+1}</b><span>${esc(h)}</span></div>`).join('')+
      exb+
      (S.show?`<div class="big">${esc(S.q.n)}</div>`:'')+
      `<p class="mu">لما حد يجاوب صح:</p>
      <div class="row">
        <button class="ta" onclick="got(0)">${esc(S.t[0])} جاب</button>
        <button class="tb" onclick="got(1)">${esc(S.t[1])} جاب</button>
      </div>
      <div class="row" style="margin-top:12px">
        ${S.hi>=5?'':'<button class="sec" onclick="more()">هينت أوضح ▶</button>'}
        <button class="sec" onclick="${S.show?'load()':'stopT();S.show=true;render()'}">${S.show?'لاعب جديد':'اكشف الاسم'}</button>
      </div>
    </div>`;

  }else if(S.mode==='grid'&&S.g){
    const g=S.g;

    if(S.editGrid){
      body=`<div class="card">
        <p class="q">مراجعة الجدول</p>
        <p class="mu">عدّل أي سؤال أو إجابة مش مضبوطة، وبعدين دوس حفظ. ده بيضمن إن اللعب يكون صح.</p>
        ${g.cats.map((c,ci)=>`
          <div class="catEdit">
            <input value="${esc(c.n)}" oninput="setGC(${ci},this.value)" placeholder="اسم الكاتيجوري">
            ${c.qs.map((q,i)=>`
              <div class="eq">
                <div class="ehead"><span>سؤال ${i+1}</span><b>${q.p} نقطة</b></div>
                <textarea oninput="setGF(${ci},${i},'q',this.value)" placeholder="السؤال">${esc(q.q)}</textarea>
                <input oninput="setGF(${ci},${i},'a',this.value)" value="${esc(q.a)}" placeholder="الإجابة">
              </div>
            `).join('')}
          </div>
        `).join('')}
        <div class="row">
          <button onclick="saveGridEdit()">حفظ وبدء اللعب</button>
          <button class="sec" onclick="closeGridEdit()">إلغاء</button>
        </div>
      </div>`;
    }else{
      body=`<p class="mu">الدور على: <b style="color:var(--gold)">${esc(S.t[g.turn])}</b> — اختار خانة (فيه خانة واحدة مخبّية دبل 🔥)</p>
      <div class="row" style="margin-bottom:8px">
        <button class="sec w" onclick="editGrid()">✏️ مراجعة/تعديل الأسئلة</button>
      </div>
      <div class="gb">`+
      g.cats.map((c,ci)=>`<div class="gc"><div class="gh">${esc(c.n)}</div>`+c.qs.map((q,i)=>{
        const k=ci*8+i;
        const u=g.used[k];
        return `<button class="tile ${u===undefined?'':'u '+(u<0?'x':u?'b':'a')}" data-p="${q.p}" ${u===undefined?'':'disabled'} onclick="openQ(${ci},${i})">${u===undefined?q.p:(u<0?'✖':q.p*(k===g.dbl?2:1))}</button>`;
      }).join('')+`</div>`).join('')+`</div>`;

      if(g.cur){
        const c=g.cats[g.cur.c];
        const q=c.qs[g.cur.i];

        sheet=`<div class="ov"><div class="sheet">
          <div class="qh"><span>${esc(c.n)}</span><span class="pt">${q.p}${g.isD?' ×2':''}</span></div>
          ${g.isD?'<div class="dbl">🔥 دبل بوينتس! النقط ×2 🔥</div>':''}
          <div style="width:130px;margin:8px auto 0">${tbox()}</div>
          ${exb}
          <p class="qq">${esc(q.q)}</p>
          ${g.ans?`<div class="ans">${esc(q.a)}</div>`:`<button class="sec w" onclick="S.g.ans=true;stopT();render()">اكشف الإجابة</button>`}
          <p class="mu">مين جاوب صح؟ (${q.p*(g.isD?2:1)} نقطة)</p>
          <div class="row">
            <button class="ta" onclick="gAward(0)">${esc(S.t[0])}</button>
            <button class="tb" onclick="gAward(1)">${esc(S.t[1])}</button>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="sec" onclick="gAward(-1)">محدش جاوب</button>
            <button class="sec" onclick="backQ()">رجوع</button>
          </div>
        </div></div>`;
      }
    }
  }

  $.innerHTML=`<div class="top">
    <button class="sec" onclick="home()">→ القايمة</button>
    <b>${NAMES[S.mode]}</b>
    <span style="width:92px"></span>
  </div>`+hud(false)+body+sheet;

  paint();
}

function pick(m){
  const a=document.getElementById('n0');
  const b=document.getElementById('n1');
  saveKey(true);
  S.t=[a.value.trim()||'الفريق الأحمر',b.value.trim()||'الفريق الأزرق'];
  go(m);
}

const _r=render;
render=function(){
  saveUsed();
  _r();

  if(S.winner===null){
    S.cf=0;
  }else if(S.winner<2 && !S.cf){
    S.cf=1;
    confetti();
  }
};

function confetti(){
  const c=['#ffc928','#22e07a','#ff4b55','#3b8cff','#a855f7'];

  for(let i=0;i<50;i++){
    const e=document.createElement('i');
    e.className='cf';
    e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*2}s`;
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),5000);
  }

  beep(660,.15);
  setTimeout(()=>beep(880,.25),180);
}

render();

if(gk()&&!gModels().length) refreshModels(true);
</script>
</body>
</html>
